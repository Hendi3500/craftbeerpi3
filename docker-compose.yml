services:
  app:
    build:
      context: .
      args:
        CBPI_PORT: "${CBPI_PORT:-5000}"
    image: craftbeerpi3:local
    container_name: craftbeerpi3
    restart: unless-stopped
    ports:
      - "${CBPI_PORT:-5000}:${CBPI_PORT:-5000}"
    environment:
      CBPI_PORT: "${CBPI_PORT:-5000}"
      TZ: "${TZ:-Europe/Berlin}"
      CBPI_DB: "/data/craftbeerpi.db"
    volumes:
      - "${CBPI_DATA_DIR:-./data}:/data"
